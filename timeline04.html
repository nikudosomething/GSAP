<!doctype html>
<html lang="zh-hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      .box {
        position: relative;
        width: 30px;
        height: 30px;
        margin-bottom: 10px;
        background-color: #1878e6;
        color: #fff;
        font-family: sans-serif;
        font-size: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .box2 {
        background-color: #eda90b;
      }
      .box3 {
        background-color: #29d306;
      }
    </style>
    <title>時間軸04</title>
  </head>
  <body>
    <div class="box box1">1</div>
    <div class="box box2">2</div>
    <div class="box box3">3</div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/GSDevTools.min.js"></script>

    <script>
      const tl = gsap.timeline();

      gsap.registerPlugin(GSDevTools);
      GSDevTools.create();

      // +=1 -=1
      tl.to(".box1", {
        left: "calc(100% - 30px)",
        duration: 1
      });

      tl.to(".box2", {
        left: "calc(100% - 30px)",
        duration: 2
      }, "+=1");
      
      tl.to(".box3", {
        left: "calc(100% - 30px)",
        duration: 1
      }, "-=1");
    </script>
  </body>
</html>
