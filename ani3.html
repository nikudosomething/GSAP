<!doctype html>
<html lang="zh-hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      .box {
        position: relative;
        width: 100px;
        height: 100px;
        background-color: #1496f2;
        margin-bottom: 10px;

        &.box2 {
          background-color: #f16b6b;
        }

        &.active {
          animation-name: ani1;
          animation-duration: 2s;
          animation-iteration-count: infinite;
        }
      }

      @keyframes ani1 {
        0% {
          left: 0;
        }
        50% {
          left: calc(100% - 100px);
        }
        100% {
          left: 0;
        }
      }
    </style>
    <title>animation-3</title>
  </head>
  <body>
    <div class="box box1"></div>
    <div class="box box2"></div>

    <script>
      const boxs = document.querySelectorAll(".box");
      boxs[0].classList.add("active")

      boxs[0].addEventListener("animationiteration", (e) => {
        boxs[0].classList.remove("active")
        boxs[1].classList.add("active")
        
      });

      boxs[1].addEventListener("animationiteration", (e) => {
        boxs[1].classList.remove("active")
        boxs[0].classList.add("active")
        
      });
    </script>
  </body>
</html>
