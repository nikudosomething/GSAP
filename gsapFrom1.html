<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gsap.From-1</title>
    <style>
      body{
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

      }
      .box {
        width: 100px;
        height: 100px;
        background-color: #9ee290;
      }
    </style>
  </head>
  <body>
    <div class="box"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script>
    

      requestIdleCallback(()=>{
        gsap.from(".box", {
        x: -500,
        duration:1,
        rotation: 360,
      });
      });
    </script>
  </body>
</html>
