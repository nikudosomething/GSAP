<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP JS (數字)屬性</title>
  <style>
    .score{
      font-size: 60px;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="score">0</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script>
    const score = document.querySelector(".score")

    const obj = {score : 0};
    score.innerHTML = obj.score ;

    gsap.to(obj,{
      score:100,
      duration:2,
      onUpdate:function(){
      const scoreNum = Math.round(obj.score);//四捨五入
      console.log(Math.round(scoreNum)); 
      score.innerHTML = scoreNum;
      }
    })
  </script>
</body>
</html>
