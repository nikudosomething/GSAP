<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>transition-1</title>
  <style>
    body{
      height: 100vh;
    }

    .btn{
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      margin: auto;
      /* width: fit-content;
      height: fit-content; */
      width: 100px;
      height: 40px;
      background-color: #31e7ff;
      text-align: center;
      line-height: 40px;
      border-radius: 4px;
      user-select: none;
      cursor:pointer;
      transition: all 0.2s;


      &:hover{
        width: 150px;
        height: 60px;
        line-height: 60px;
        border-radius: 6px;
      }

    }
  </style>
</head>
<body>
  <div class="btn">按鈕-1</div>
</body>
</html>
