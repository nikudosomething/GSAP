<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>transition-2 控制子節點</title>
    <style>
      body {
        height: 100vh;
      }

      .btn {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        margin: auto;
        /* width: fit-content;
      height: fit-content; */
        width: 100px;
        height: 40px;
        background-color: #31e7ff;
        text-align: center;
        line-height: 40px;
        border-radius: 4px;
        user-select: none;
        cursor: pointer;
        overflow: hidden;

        .bg{
          position: absolute;
          left: 0;
          top: 0;
          width: 0%;
          height: 100%;
          background-color: #f7a26a;
          transition: all 0.2s;
        }

        .text{
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
        }

        &:hover .bg{
          width: 100%
          
        }
      }
    </style>
  </head>
  <body>
    <div class="btn">
      <div class="bg"></div>
      <div class="text">按鈕-1</div>
    </div>
  </body>
</html>
