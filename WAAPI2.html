<!doctype html>
<html lang="zh-hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      .box {
        position: relative;
        width: 100px;
        height: 100px;
        background-color: #ffdf87;
        margin-bottom: 10px;

        &.box2 {
          background-color: #f16b6b;
        }
      }
    </style>
    <title>WAAPI-2</title>
  </head>
  <body>
    <div class="box box1"></div>
    <!-- <div class="box box2"></div> -->
    <button>暫停</button>
    <button>繼續播放</button>
    <button>反向播放</button>
    <button>兩倍速</button>
    <button>原速</button>

    <script>
      const box = document.querySelector(".box");
      const btns = document.querySelectorAll("button");

      const ani1 = box.animate(
        [
          //[],{} => 變數,設定
          { left: 0 },
          { left: "calc(100% - 100px)" },
          { left: 0 },
        ],
        {
          duration: 2000,
          iterations: Infinity,
        },
      );

      btns[0].addEventListener("click",()=>{
        ani1.pause();
      })

      btns[1].addEventListener("click",()=>{
        ani1.play();
      })
      
      btns[2].addEventListener("click",()=>{
        ani1.reverse();
      })

      btns[3].addEventListener("click",()=>{
        ani1.playbackRate = 3;
      })

      btns[4].addEventListener("click",()=>{
        ani1.playbackRate = 1;
      })

    </script>
  </body>
</html>
