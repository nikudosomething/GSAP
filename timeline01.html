<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>時間軸01</title>
  <style>
    .box{
      position: relative;
      width: 30px;
      height: 30px;
      margin-bottom: 10px;
      background-color: #1878e6;
      color: #fff;
      font-family: sans-serif;
      font-size: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .box2{
      background-color: #eda90b;
    }
    .box3{
      background-color: #29d306;
    }
  </style>
</head>
<body>
  <div class="box box1">1</div>
  <div class="box box2">2</div>
  <div class="box box3">3</div>


  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

  <script>
    const tl = gsap.timeline()
    tl.to(".box1",{
      left:"calc(100% - 30px)",
      duration:0.5
    })
    
    tl.to(".box2",{
      left:"calc(100% - 30px)",
      duration:2
    })
    
    tl.to(".box3",{
      left:"calc(100% - 30px)",
      duration:1
    })
    
  </script>

</body>
</html>
