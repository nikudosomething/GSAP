<!DOCTYPE html>
<html lang="zh-hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .box{
      position: relative;
      width: 100px;
      height: 100px;
      background-color: #f85a5a;
    }
  </style>
  <title>gsap.to() CSS 屬性</title>
</head>
<body>
  <div class="box"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script>
    requestIdleCallback(() => {
      gsap.to(".box", {
        left: "calc(100% - 100px)",
        rotation: 360,
        duration: 1
      })
    })
  </script>
</body>
</html>
